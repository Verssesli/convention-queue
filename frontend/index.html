<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Convention Queue</title>
    <script>
        // Strip the access hash out of the address bar the instant the page starts
        // parsing, before anything is rendered or is screenshot-able. replaceState
        // rewrites the current history entry in place rather than navigating, so
        // there is no previous entry holding the secret for "back" to return to,
        // and no redirect round-trip. The #route fragment is preserved.
        (function () {
            try {
                if (location.pathname !== '/') {
                    history.replaceState(null, '', '/' + (location.hash || ''));
                }
            } catch (_) { /* non-fatal: the page still works, the URL just stays put */ }
        })();
    </script>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=cabinet-grotesk@500,700&display=swap" rel="stylesheet">
    <style>
        :root, [data-theme="light"] {
            --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
            --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
            --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
            --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
            --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);

            --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
            --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
            --space-12:3rem;--space-16:4rem;

            --color-bg:#f7f6f2;--color-surface:#f9f8f5;--color-surface-2:#fbfbf9;
            --color-surface-offset:#edeae5;--color-border:#d4d1ca;--color-divider:#dcd9d5;
            --color-text:#28251d;--color-text-muted:#6c6a64;--color-text-faint:#9b9993;
            --color-text-inverse:#f9f8f4;
            --color-primary:#01696f;--color-primary-hover:#0c4e54;
            --color-primary-highlight:#dcebea;
            --color-success:#157a35;--color-success-bg:#b8efca;
            --color-danger:#991828;--color-danger-bg:#fcc;

            --color-waiting:#8a8882;--color-waiting-bg:#ece9e4;
            --radius-sm:.5rem;--radius-md:.75rem;--radius-lg:1rem;
            --radius-xl:1.25rem;--radius-full:9999px;
            --shadow-sm:0 1px 2px rgba(26,24,19,.06);
            --shadow-md:0 8px 24px rgba(26,24,19,.08);
            --transition:180ms cubic-bezier(.16,1,.3,1);
            --font-body:'Satoshi',Inter,sans-serif;
            --font-display:'Cabinet Grotesk','Satoshi',sans-serif;
        }
        [data-theme="dark"] {
            --color-bg:#171614;--color-surface:#1c1b19;--color-surface-2:#201f1d;
            --color-surface-offset:#262422;--color-border:#3a3836;--color-divider:#2c2a28;
            --color-text:#ece9e3;--color-text-muted:#b6b2aa;--color-text-faint:#86827a;
            --color-text-inverse:#171614;
            --color-primary:#5ea8b2;--color-primary-hover:#7bbac3;
            --color-primary-highlight:rgba(94,168,178,.14);
            --color-success:#70d68d;--color-success-bg:#0a2e14;
            --color-danger:#ff8c95;--color-danger-bg:#2e0a0f;
            --color-waiting:#bdb7ac;--color-waiting-bg:rgba(130,124,112,.24);
            --shadow-sm:0 1px 2px rgba(0,0,0,.22);--shadow-md:0 8px 24px rgba(0,0,0,.35);
        }
        *{box-sizing:border-box;}
        html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
        body{margin:0;min-height:100dvh;font-family:var(--font-body);font-size:var(--text-base);
            background:var(--color-bg);color:var(--color-text);line-height:1.55;}
        button,input,select{font:inherit;color:inherit;}
        a{color:inherit;text-decoration:none;}
        .shell{min-height:100dvh;display:grid;grid-template-rows:auto 1fr;}
        .topbar{position:sticky;top:0;z-index:20;
            background:color-mix(in srgb,var(--color-bg) 88%,transparent);
            backdrop-filter:blur(16px);border-bottom:1px solid var(--color-divider);
            padding:calc(env(safe-area-inset-top) + var(--space-3)) var(--space-4) var(--space-3);}
        .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);}
        .topbar-nav{display:flex;gap:var(--space-2);overflow-x:auto;scrollbar-width:none;}
        .topbar-nav::-webkit-scrollbar{display:none;}
        .icon-btn,.btn,.nav-chip{min-height:44px;min-width:44px;border:1px solid var(--color-border);
            background:var(--color-surface);border-radius:var(--radius-full);
            transition:transform var(--transition),background var(--transition),border-color var(--transition),color var(--transition);}
        .icon-btn:active,.btn:active,.nav-chip:active{transform:scale(.98);}
        .icon-btn{display:inline-grid;place-items:center;width:44px;padding:0;cursor:pointer;}
        .icon-btn > span{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;flex:none;}
        .icon-btn > span > svg{width:19px;height:19px;display:block;}
        .nav-chip{padding:0 var(--space-4);white-space:nowrap;display:inline-flex;align-items:center;
            justify-content:center;font-size:var(--text-sm);color:var(--color-text-muted);font-weight:500;}
        .nav-chip.active{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-text-inverse);font-weight:700;}

        .page {
            width:min(100%,920px);margin:0 auto;
            padding:var(--space-5) var(--space-4) calc(var(--space-12) + env(safe-area-inset-bottom));
            display:flex;flex-direction:column;
        }

        .stack{display:grid;gap:var(--space-4);}
        .card{background:var(--color-surface);border:1px solid var(--color-border);
            border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);padding:var(--space-5);}
        .hero-card{padding:var(--space-6);border-radius:calc(var(--radius-xl) + .25rem);}
        .queue-screen{flex:1;display:grid;align-content:center;gap:var(--space-4);}

        .page-title{font-family:var(--font-display);font-size:var(--text-base);line-height:1;
            letter-spacing:-.01em;margin:0;color:inherit;font-weight:700;}
        @media(min-width:760px) {
            .page-title { font-size: var(--text-lg); }
        }

        .queue-number{font-family:var(--font-display);font-size:clamp(4rem,18vw,7rem);
            line-height:.9;letter-spacing:-.06em;margin:var(--space-2) 0 0;}
        .subtle{color:var(--color-text-muted);font-size:var(--text-sm);margin:0;}
        .micro{color:var(--color-text-faint);font-size:var(--text-xs);}
        .btn-row,.admin-actions{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;}
        .action-container { display:grid; gap:var(--space-3); }
        .btn{padding:0 var(--space-5);border-radius:var(--radius-full);display:inline-flex;
            align-items:center;justify-content:center;gap:var(--space-2);
            font-size:var(--text-sm);font-weight:700;cursor:pointer;min-height:44px;}
        .btn-primary{background:var(--color-primary);color:var(--color-text-inverse);border-color:var(--color-primary);}
        .btn-primary:hover{background:var(--color-primary-hover);}
        .btn-secondary{background:var(--color-surface);}
        .btn-danger{background:var(--color-danger-bg);border-color:transparent;color:var(--color-danger);}
        .btn[disabled]{opacity:.45;cursor:not-allowed;}

        .pill{display:inline-flex;align-items:center;gap:var(--space-2);border-radius:var(--radius-full);
            padding:.45rem 1.1rem;font-size:var(--text-xs);font-weight:700;border:1px solid transparent;
            max-width:max-content;}
        .pill.waiting{background:var(--color-waiting-bg);color:var(--color-waiting);}
        .pill.allowed{background:var(--color-success-bg);color:color-mix(in srgb,var(--color-success) 85%,black);}
        .pill.expired{background:var(--color-danger-bg);color:var(--color-danger);}

        .meta-grid{display:grid;gap:var(--space-3);grid-template-columns:repeat(2,minmax(0,1fr));margin-top:var(--space-2);}
        .meta{background:var(--color-surface-2);border:1px solid var(--color-border);
            border-radius:var(--radius-lg);padding:var(--space-4);display:flex;flex-direction:column;justify-content:center;}
        .meta-label{color:var(--color-text-muted);font-size:var(--text-xs);text-transform:uppercase;
            letter-spacing:.08em;font-weight:700;margin-bottom:var(--space-1);}
        .meta-value{font-size:var(--text-base);font-weight:700;}
        .refresh-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);min-height:46px;}
        .catalogue-stack{display:grid;gap:var(--space-4);}
        .catalogue-image{width:100%;max-width:720px;margin:0 auto;border-radius:var(--radius-xl);border:1px solid var(--color-border);
            background:var(--color-surface-2);box-shadow:var(--shadow-sm);overflow:hidden;}
        .catalogue-image img{width:100%;height:auto;display:block;}
        .loading-bar{height:.75rem;border-radius:var(--radius-full);
            background:linear-gradient(90deg,var(--color-surface-offset) 20%,var(--color-surface-2) 50%,var(--color-surface-offset) 80%);
            background-size:200% 100%;animation:shimmer 1.5s linear infinite;}
        .notice{border-radius:var(--radius-lg);padding:var(--space-4);
            background:var(--color-primary-highlight);color:var(--color-text);
            border:1px solid color-mix(in srgb,var(--color-primary) 20%,var(--color-border));
            font-size:var(--text-sm);}
        .empty{text-align:center;padding:var(--space-10) var(--space-4);
            border:1px dashed var(--color-border);border-radius:var(--radius-xl);
            color:var(--color-text-muted);background:var(--color-surface);}
        .hidden{display:none!important;}
        .spin-once{animation:spinOnce .85s cubic-bezier(.16,1,.3,1) 1;}
        @keyframes spinOnce{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
        body.state-allowed{background:var(--color-success-bg);}
        body.state-expired{background:var(--color-danger-bg);}
        body.state-error{background:var(--color-danger-bg);}
        @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
    </style>
</head>
<body>
<div class="shell">
    <header class="topbar">
        <div class="topbar-row">
            <nav class="topbar-nav" aria-label="Views">
                <a class="nav-chip" data-route-link href="#queue">Queue</a>
                <a class="nav-chip" data-route-link href="#catalogue">Catalogue</a>
            </nav>
            <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
                <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
    </header>
    <main class="page" id="app" aria-live="polite"></main>
</div>
<script>
    const CONFIG = {
        API_BASE: '',
        ARTIST_LABEL: "the artist",
        QUEUE_COOKIE: 'con_queue_id',
        THEME_COOKIE: 'con_theme',
        AUTO_REFRESH_MS: 60000,
        // If the page comes back into view and the data is older than this, do a
        // visible "welcome back" re-check. Anything fresher is left alone so a
        // quick app-switch doesn't flash the screen for no reason.
        RESUME_STALE_MS: 5000,
        // A fetch issued just as the phone locks can hang indefinitely. Without a
        // timeout that would leave refreshing=true forever and wedge the page.
        REQUEST_TIMEOUT_MS: 15000
    };

    const state = {
        route: getRoute(),
        queueId: getCookie(CONFIG.QUEUE_COOKIE),
        queueStatus: null,
        catalogue: [],
        refreshTimer: null,
        refreshing: false,
        resuming: false,
        staleRefresh: false,
        lastRefreshedAt: null
    };

    const app = document.getElementById('app');

    function getRoute() {
        return location.hash.replace('#', '').trim() || 'queue';
    }

    function setCookie(name, value, days = 30) {
        const exp = new Date(Date.now() + days * 86400000).toUTCString();
        document.cookie = `${name}=${encodeURIComponent(value)}; expires=${exp}; path=/; SameSite=Lax`;
    }

    function getCookie(name) {
        const m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/[.$?*|{}()[\]\\/+^]/g,'\\$&') + '=([^;]*)'));
        return m ? decodeURIComponent(m[1]) : null;
    }

    function deleteCookie(name) {
        document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax`;
    }

    function fmtNum(n) {
        if (n === null || n === undefined || Number.isNaN(Number(n))) return 'XXX';
        return String(n).padStart(3, '0');
    }

    function parseD(v) { return v ? new Date(v) : null; }

    function roundDown(v) {
        const d = parseD(v); if (!d) return null;
        d.setSeconds(0, 0); return d;
    }

    function roundUp(v) {
        const d = parseD(v); if (!d) return null;
        if (d.getSeconds() !== 0 || d.getMilliseconds() !== 0) d.setMinutes(d.getMinutes() + 1);
        d.setSeconds(0, 0); return d;
    }

    function fmtTime(v, mode = 'down') {
        const d = mode === 'up' ? roundUp(v) : roundDown(v);
        if (!d) return '—';
        return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    function fmtJoined(v) {
        const d = roundDown(v); if (!d) return '—';
        return d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    function minsLeft(currentTime, expiresAt) {
        const now = roundDown(currentTime), exp = roundUp(expiresAt);
        if (!now || !exp) return 0;
        return Math.max(0, Math.ceil((exp - now) / 60000));
    }

    function deriveStage(s) {
        if (s && s.isError) return 'error';
        if (!s || !s.queueId) return 'never';
        const allowed = parseD(s.allowedIn), exp = parseD(s.expiresAt), now = parseD(s.currentTime);
        if (!allowed) return 'queued';
        if (allowed && exp && now && now < exp) return 'allowed';
        return 'expired';
    }

    function stageLabel(s) {
        const m = { never: 'Not joined', queued: 'Waiting', allowed: 'Allowed now', expired: 'Expired', error: 'Error' };
        return m[deriveStage(s)] || 'Waiting';
    }

    async function api(path, opts = {}) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), CONFIG.REQUEST_TIMEOUT_MS);
        let res;
        try {
            res = await fetch(CONFIG.API_BASE + path, {
                ...opts,
                headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
                signal: ctrl.signal
            });
        } finally {
            clearTimeout(timer);
        }
        if (!res.ok) {
            let detail = 'Request failed';
            try { const e = await res.json(); detail = e.message || detail; } catch(_) {}
            const err = new Error(detail);
            err.status = res.status;
            throw err;
        }
        const ct = res.headers.get('content-type') || '';
        return ct.includes('application/json') ? res.json() : res.text();
    }

    function clearTimer() {
        if (state.refreshTimer) { clearInterval(state.refreshTimer); state.refreshTimer = null; }
    }

    function startTimer(fn) {
        clearTimer();
        state.refreshTimer = setInterval(fn, CONFIG.AUTO_REFRESH_MS);
    }

    function setBodyState(stage) {
        document.body.classList.remove('state-allowed', 'state-expired', 'state-error');
        if (stage === 'allowed') document.body.classList.add('state-allowed');
        else if (stage === 'expired') document.body.classList.add('state-expired');
        else if (stage === 'error') document.body.classList.add('state-error');
    }

    function refreshIcon() {
        return `<span${state.refreshing ? ' class="spin-once"' : ''}><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15.5-6.36L21 8"/>
      <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15.5 6.36L3 16"/></svg></span>`;
    }

    function renderNav() {
        document.querySelectorAll('[data-route-link]').forEach(l => {
            l.classList.toggle('active', l.getAttribute('href') === '#' + state.route);
        });
    }

    function setTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        setCookie(CONFIG.THEME_COOKIE, t, 365);
        document.getElementById('themeIcon').innerHTML = t === 'dark'
            ? '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>'
            : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
        setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    (function initTheme() {
        const saved = getCookie(CONFIG.THEME_COOKIE);
        const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches;
        setTheme(saved || (sysDark ? 'dark' : 'light'));
    })();

    /* ── QUEUE PAGE ── */
    function renderQueuePage() {
        renderNav(); clearTimer();

        const refreshTimeStr = state.lastRefreshedAt
            ? `<div class="micro" style="opacity: 0.85;">Last refreshed: ${state.lastRefreshedAt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}${state.staleRefresh ? ' · couldn\'t reach server' : ''}</div>`
            : '';

        // The "XXX" checking screen. Shown while we have no status yet, and also on
        // a resume re-check so a returning user can see at a glance that the number
        // on screen is being re-verified rather than trusting a stale one.
        if (state.queueId && (!state.queueStatus || state.resuming)) {
            setBodyState('');
            const checkTitle = state.resuming ? 'Welcome back' : 'Checking your spot';
            const checkCopy  = state.resuming ? 'Refreshing your place in line…' : 'Updating status from server…';
            app.innerHTML = `
        <section class="queue-screen">
          <div class="card hero-card stack">
            <div class="refresh-row">
              <div class="pill waiting"><h1 class="page-title">${checkTitle}</h1></div>
              <button class="icon-btn" id="refreshBtn" aria-label="Refresh">${refreshIcon()}</button>
            </div>
            <p class="queue-number">XXX</p>
            <p class="subtle">${checkCopy}</p>
            <div class="loading-bar"></div>
            <div class="action-container">
              <div class="btn-row"><button class="btn btn-secondary" disabled>Join queue</button></div>
              ${refreshTimeStr}
            </div>
          </div>
        </section>`;
            document.getElementById('refreshBtn').addEventListener('click', () => doRefresh());
            startTimer(() => doRefresh());
            return;
        }

        const s = state.queueStatus;
        const stage = deriveStage(s);

        if (!state.queueId || stage === 'never') {
            setBodyState('');
            app.innerHTML = `
        <section class="queue-screen">
          <div class="card hero-card stack">
            <div class="refresh-row">
              <div class="pill waiting"><h1 class="page-title">Join the virtual line</h1></div>
              <button class="icon-btn" id="refreshBtn" aria-label="Refresh">${refreshIcon()}</button>
            </div>
            <p class="subtle" style="margin-top: var(--space-2);">No account needed — you'll be assigned a number. Your spot is saved securely inside this browser session.</p>
            <div class="action-container">
              <div class="btn-row"><button class="btn btn-primary" id="joinBtn">Join queue</button></div>
              ${refreshTimeStr}
            </div>
          </div>
        </section>`;
            document.getElementById('joinBtn').addEventListener('click', doJoin);
            document.getElementById('refreshBtn').addEventListener('click', () => doRefresh());
            startTimer(() => doRefresh());
            return;
        }

        setBodyState(stage);

        const highest = s && s.highestServingQueueNumber ? fmtNum(s.highestServingQueueNumber) : 'XXX';
        const qNum    = stage === 'error' ? 'XXX' : fmtNum(s.queueNumber);
        const pillClass  = stage === 'allowed' ? 'allowed' : (stage === 'expired' || stage === 'error') ? 'expired' : 'waiting';

        const secondaryCopy =
            stage === 'error' ? `Your queue ID is invalid. This is usually caused by the artist resetting the queue or if you have a queue ID from a different day. <br /><br />Please return to their booth if you believe this is in error. Alternatively, click re-queue below to rejoin the queue.`
                : stage === 'allowed' ? `Please join the line at ${CONFIG.ARTIST_LABEL}'s booth before the timer is up.`
                    : stage === 'expired' ? `Unfortunately, you missed your call. This page refreshes every minute — please check it often.`
                        : `Currently serving through number ${highest}.`;

        const mLeft = s ? minsLeft(s.currentTime, s.expiresAt) : 0;

        const actionBtns =
            stage === 'error'
                ? `<button class="btn btn-secondary" id="requeueBtn">Re-queue</button>`
                : stage === 'queued'
                    ? `<button class="btn btn-danger" id="leaveBtn">Leave queue</button>`
                    : stage === 'allowed'
                        ? `<button class="btn btn-danger" id="leaveBtn">Leave queue</button>
                   <button class="btn btn-secondary" id="requeueBtn">Re-queue</button>`
                        : `<button class="btn btn-secondary" id="requeueBtn">Re-queue</button>`;

        const metaGridHtml = stage === 'error' ? '' : `
          <div class="meta-grid">
            <div class="meta"><div class="meta-label">Serving through</div><div class="meta-value">${highest}</div></div>
            <div class="meta"><div class="meta-label">Allowed at</div><div class="meta-value">${s.allowedIn ? fmtTime(s.allowedIn,'down') : '—'}</div></div>
            <div class="meta"><div class="meta-label">Expires at</div><div class="meta-value">${s.expiresAt ? fmtTime(s.expiresAt,'up') : '—'}</div></div>
            <div class="meta">
              <div class="meta-label">${stage === 'queued' ? 'Joined at' : stage === 'allowed' ? 'Time remaining' : 'Your ID'}</div>
              <div class="meta-value" style="font-size:${stage === 'queued' ? 'var(--text-base)' : 'var(--text-sm)'}; word-break:break-all;">
                ${stage === 'queued' ? fmtJoined(s.joinedAt) : stage === 'allowed' ? mLeft + ' min' : s.queueId}
              </div>
            </div>
          </div>`;

        app.innerHTML = `
      <section class="queue-screen">
        <div class="card hero-card stack">
          <div class="refresh-row">
            <div class="pill ${pillClass}">
              <h1 class="page-title">${stageLabel(s)}</h1>
            </div>
            <button class="icon-btn" id="refreshBtn" aria-label="Refresh">${refreshIcon()}</button>
          </div>
          <p class="queue-number">${qNum}</p>
          <p class="subtle" style="margin-top: var(--space-2); line-height: 1.6;">${secondaryCopy}</p>
          ${metaGridHtml}
          <div class="action-container">
            <div class="btn-row">${actionBtns}</div>
            ${refreshTimeStr}
          </div>
        </div>
      </section>`;

        document.getElementById('refreshBtn').addEventListener('click', () => doRefresh());
        if (document.getElementById('leaveBtn'))   document.getElementById('leaveBtn').addEventListener('click', doLeave);
        if (document.getElementById('requeueBtn')) document.getElementById('requeueBtn').addEventListener('click', doRequeue);
        startTimer(() => doRefresh());
    }

    async function doJoin() {
        try {
            const data = await api('/api/queue/join', { method:'POST', body:'{}' });
            state.queueId = data.queueId;
            state.queueStatus = data;
            state.lastRefreshedAt = new Date();
            setCookie(CONFIG.QUEUE_COOKIE, data.queueId, 30);
            renderQueuePage();
        } catch(e) { alert(e.message); }
    }

    // opts.resume — set only by handleResume(). Puts the page into the "XXX"
    // checking state for the duration, which normal timer/manual refreshes skip.
    async function doRefresh(opts = {}) {
        if (!state.queueId) {
            state.lastRefreshedAt = new Date();
            renderQueuePage();
            return;
        }
        if (state.refreshing) return;

        state.refreshing = true;
        if (opts.resume === true) state.resuming = true;
        renderQueuePage();

        const minSpin = new Promise(r => setTimeout(r, 850));
        try {
            const [data] = await Promise.all([
                api('/api/queue/status?queueId=' + encodeURIComponent(state.queueId)),
                minSpin
            ]);
            state.lastRefreshedAt = new Date();
            state.staleRefresh = false;
            if (data.leftQueue) {
                deleteCookie(CONFIG.QUEUE_COOKIE); state.queueId = null; state.queueStatus = null;
            } else {
                state.queueStatus = data;
            }
        } catch(e) {
            await minSpin;
            if (e.status === 404) {
                // The server answered — the entry is genuinely gone.
                state.queueStatus = { isError: true };
                state.lastRefreshedAt = new Date();
                state.staleRefresh = false;
            } else {
                // Network error or timeout: keep the last known status, but don't
                // bump "Last refreshed" — claiming freshness we don't have is
                // exactly the false impression we're trying to avoid.
                state.staleRefresh = true;
            }
        } finally {
            state.refreshing = false;
            state.resuming = false;
            renderQueuePage();
        }
    }

    async function doLeave() {
        if (!confirm('Leave the queue? This will permanently lose your current spot.')) return;
        try {
            await api('/api/queue/leave', { method:'POST', body: JSON.stringify({ queueId: state.queueId }) });
            deleteCookie(CONFIG.QUEUE_COOKIE); state.queueId = null; state.queueStatus = null;
            state.lastRefreshedAt = new Date();
            renderQueuePage();
        } catch(e) { alert(e.message); }
    }

    async function doRequeue() {
        if (!confirm('Re-queue? You\'ll get a new number at the back of the line and lose your current spot.')) return;
        try {
            const data = await api('/api/queue/requeue', { method:'POST', body: JSON.stringify({ queueId: state.queueId }) });
            state.queueId = data.queueId;
            state.queueStatus = data;
            state.lastRefreshedAt = new Date();
            setCookie(CONFIG.QUEUE_COOKIE, data.queueId, 30);
            renderQueuePage();
        } catch(e) { alert(e.message); }
    }

    /* ── CATALOGUE PAGE ── */
    async function renderCataloguePage() {
        renderNav(); clearTimer(); setBodyState('');
        app.innerHTML = `<section class="stack">
      <div class="card stack">
        <div class="refresh-row">
          <div class="pill waiting"><h1 class="page-title">Available items</h1></div>
          <button class="icon-btn" id="refreshCatBtn" aria-label="Refresh">${refreshIcon()}</button>
        </div>
        <p class="subtle" style="margin-top: var(--space-2);">Browse the available items below.</p>
      </div>
      <div class="catalogue-stack" id="catImages"><div class="loading-bar"></div></div>
    </section>`;

        document.getElementById('refreshCatBtn').addEventListener('click', doRefreshCatalogue);

        try {
            const data = await api('/api/catalogue');
            const imgs = [...(data.images || [])].sort((a,b) => a.order - b.order);
            const el = document.getElementById('catImages');
            el.innerHTML = imgs.length
                ? imgs.map(img => `<figure class="catalogue-image"><img src="${esc(img.imageUrl)}" alt="Catalogue page ${img.order}" loading="lazy" decoding="async"></figure>`).join('')
                : `<div class="empty">No catalogue images are available yet.</div>`;
        } catch(_) {
            document.getElementById('catImages').innerHTML = `<div class="empty">Could not load catalogue.</div>`;
        }
    }

    async function doRefreshCatalogue() {
        if (state.refreshing) return;
        state.refreshing = true;

        await renderCataloguePage();

        setTimeout(() => {
            state.refreshing = false;
            const btn = document.getElementById('refreshCatBtn');
            if (btn) btn.innerHTML = refreshIcon();
        }, 850);
    }

    function esc(s) {
        return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
    }

    function renderRoute() {
        state.route = getRoute();
        if (state.route === 'catalogue') return renderCataloguePage();

        renderQueuePage();

        if (state.queueId && !state.queueStatus && !state.refreshing) {
            doRefresh();
        }
    }

    /* ── Resume detection ──
       Almost everyone is on a phone. They lock the screen, switch apps, or leave
       the tab — at which point the browser throttles or fully freezes our timers,
       and iOS may restore the page from bfcache showing whatever was last painted.
       The result is a stale number that looks current, so someone who has actually
       been called thinks they haven't been. Re-check the moment we come back.

       No single event covers both platforms, so we listen to all of them and let
       handleResume() dedupe:
         visibilitychange — the primary signal on iOS and Android
         pageshow         — fires on iOS Safari bfcache restore, where
                            visibilitychange frequently does not
         focus            — catches app-switcher returns that skip both of the above
         resume           — Page Lifecycle API, for pages Chrome/Android froze
    */
    function handleResume() {
        if (document.visibilityState !== 'visible') return;
        if (state.route !== 'queue' || !state.queueId) return;
        if (state.refreshing) return;
        const sinceMs = state.lastRefreshedAt ? Date.now() - state.lastRefreshedAt.getTime() : Infinity;
        // Data is still fresh — a brief switch away and back needs no interruption.
        if (sinceMs < CONFIG.RESUME_STALE_MS) return;
        doRefresh({ resume: true });
    }

    document.addEventListener('visibilitychange', handleResume);
    document.addEventListener('resume', handleResume);
    window.addEventListener('pageshow', handleResume);
    window.addEventListener('focus', handleResume);

    window.addEventListener('hashchange', renderRoute);
    renderRoute();
</script>
</body>
</html>
